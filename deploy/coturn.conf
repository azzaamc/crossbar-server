# coturn configuration for a Crossbar public-mode deployment.
#
# This is a template, not a file coturn can read. coturn's format is a list of
# `option=value` pairs and it performs no environment substitution of its own -- a value
# is taken literally, `${CROSSBAR_TURN_SHARED_SECRET}` and all -- so the references below
# are expanded at start-up by `crossbar-turn.service`, with `envsubst`, into
# /run/coturn/turnserver.conf, using the same .env the Crossbar server reads. Editing this
# file on the host therefore changes nothing until that unit is restarted, and the shared
# secret never has to be written down here.
#
# What this server is for: when two devices cannot reach each other directly over ICE, the
# media is relayed. That is a service offered to whoever holds valid credentials, so
# authentication is the whole of the security model.

# ── Authentication ───────────────────────────────────────────────────────────────
#
# No per-user accounts. The REST scheme hands a client a username that carries its own
# expiry and a password that is the HMAC of that username under a secret only coturn and
# the application know. The secret below is never given to a client: clients receive
# credentials derived from it, valid for CROSSBAR_TURN_TTL_SECONDS, so a credential that
# leaks from a device is worthless within minutes.
use-auth-secret
static-auth-secret=${CROSSBAR_TURN_SHARED_SECRET}

# A label rather than a boundary, but it must be non-empty and stable: a credential is
# only valid for the realm it was issued against.
realm=${CROSSBAR_PUBLIC_HOSTNAME}

# ── Listeners ────────────────────────────────────────────────────────────────────
#
# Both transports on the one port, which is what the server advertises (`turn:...` with
# `?transport=udp` and `?transport=tcp`): a network that drops UDP still has to work, and
# coturn answers STUN on this port as well, so opening it once buys discovery too. `no-udp`
# and `no-tcp` are deliberately absent.
listening-port=${CROSSBAR_TURN_PORT}

# The relay ports. Every relayed session takes one from this range, so the range is both
# the concurrency limit and the firewall rule: it is sized well past a household of four.
# Because this host sits behind the home router, that range has to be forwarded 1:1 --
# relayed port N in must stay port N out -- or media leaves on an address the far side will
# not accept.
min-port=${CROSSBAR_TURN_MIN_PORT}
max-port=${CROSSBAR_TURN_MAX_PORT}

# ── Hardening ────────────────────────────────────────────────────────────────────
#
# An open relay is forbidden. With no credential check this server would forward traffic
# from anywhere to anywhere over the operator's connection: the quickest way to have a home
# address reported for abuse, and a traffic bill nobody agreed to. `use-auth-secret` above
# is what prevents that, so it is never removed "just to test a call".
#
# The admin CLI is a second listening interface, on a port that appears in no firewall
# rule, and this deployment has no use for it.
no-cli

# Peers on multicast and broadcast addresses are an amplification and spoofing path out of
# the relay. No browser client needs them.
no-multicast-peers

# Consent freshness: fingerprint relay traffic so the far end can tell it was relayed by
# this server and has not been altered in between.
fingerprint

# Expire nonces every ten minutes, so one observed in transit is not reusable forever.
stale-nonce=600

# TLS and DTLS listeners are off on purpose. The ICE list a client receives contains plain
# `turn:` URLs, so nothing here ever accepts `turns:`, and keeping the listeners off means
# no certificate to renew on this host and no 5349 to open. The relay is gated by
# credentials, not by the transport.
no-tls
no-dtls

# journald collects stdout, so there is no log file to rotate and none to leave behind in
# a directory the hardened unit cannot write to.
log-file=stdout
new-log-timestamp

# ── NAT ──────────────────────────────────────────────────────────────────────────
#
# A home connection is behind NAT, and coturn has to advertise the address clients can
# actually reach; without this it can hand out a relay address on the private LAN, which
# nobody outside can use. It takes the public address, then this host's own LAN address.
#
# A host with a public address of its own leaves the value empty, and the unit drops the
# line rather than handing coturn an option with nothing after it.
#
# A residential address changes (see README.md): when it does, this value and the DNS
# record are both stale, and relayed media stops working while everything else appears fine.
external-ip=${CROSSBAR_TURN_EXTERNAL_IP}
